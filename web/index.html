<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0d">
<title>流光逸影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --panel: #121318;
    --panel-2: #171922;
    --line: rgba(235, 225, 205, .08);
    --text: #ece7dc;
    --muted: #8f8a7d;
    --dim: #5c5850;
    --gold: #d9ab5c;
    --gold-soft: rgba(217, 171, 92, .14);
    --danger: #e07a72;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  /* 胶片颗粒：覆盖全屏的签名质感层 */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 999; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
  }
  ::selection { background: var(--gold-soft); color: var(--gold); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
    background: rgba(236, 231, 220, .04); border: 1px solid var(--line);
    color: #c9c4b8; border-radius: 11px; padding: 8px 14px; font-size: 13px;
    font-family: var(--sans); letter-spacing: .04em; cursor: pointer;
    transition: background .18s, border-color .18s, color .18s;
  }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .btn:active { background: rgba(236, 231, 220, .09); border-color: rgba(217, 171, 92, .35); color: var(--gold); }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 10; padding: 15px 18px 14px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(10, 10, 13, .82);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }
  header::after {
    /* 流光：签名式渐变发丝线 */
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent 8%, rgba(217,171,92,.65) 32%, #f4e3bb 50%, rgba(217,171,92,.65) 68%, transparent 92%) ;
    background-size: 220% 100%;
    animation: sheen 7s linear infinite;
    opacity: .55;
  }
  @keyframes sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .brand { flex: 1; display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand .mark { width: 30px; height: 30px; flex-shrink: 0; color: var(--gold); display: grid; place-items: center; }
  .brand .mark svg { width: 24px; height: 24px; }
  header h1 {
    font-family: var(--serif); font-size: 18px; font-weight: 900; letter-spacing: .16em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-actions { display: flex; gap: 8px; }

  /* ---------- 面包屑 ---------- */
  #crumbs {
    padding: 12px 18px 2px; font-size: 12px; color: var(--dim);
    overflow-x: auto; white-space: nowrap; letter-spacing: .02em;
    -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent);
    scrollbar-width: none;
  }
  #crumbs::-webkit-scrollbar { display: none; }
  #crumbs a { color: var(--muted); text-decoration: none; cursor: pointer; transition: color .15s; padding: 4px 2px; }
  #crumbs a:hover { color: var(--gold); }
  #crumbs a:first-child { color: var(--gold); }

  /* ---------- 影库列表 ---------- */
  #list { list-style: none; padding: 6px 10px calc(88px + env(safe-area-inset-bottom)); }
  .item {
    display: flex; align-items: center; gap: 14px; padding: 12px 10px;
    border-radius: 14px; cursor: pointer; border-bottom: 1px solid rgba(235, 225, 205, .04);
    animation: rise .45s cubic-bezier(.22, .7, .25, 1) backwards;
    transition: background .15s;
  }
  .item:hover { background: rgba(236, 231, 220, .025); }
  .item:active { background: var(--panel-2); }
  .item:nth-child(1) { animation-delay: .02s; } .item:nth-child(2) { animation-delay: .05s; }
  .item:nth-child(3) { animation-delay: .08s; } .item:nth-child(4) { animation-delay: .11s; }
  .item:nth-child(5) { animation-delay: .14s; } .item:nth-child(6) { animation-delay: .17s; }
  .item:nth-child(7) { animation-delay: .20s; } .item:nth-child(8) { animation-delay: .23s; }
  .item:nth-child(n+9) { animation-delay: .26s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .item .icon {
    width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(236, 231, 220, .045); color: #a9a498;
    border: 1px solid rgba(235, 225, 205, .05);
  }
  .item .icon svg { width: 19px; height: 19px; }
  .item.is-dir .icon { background: var(--gold-soft); color: var(--gold); border-color: rgba(217, 171, 92, .18); }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 15px; word-break: break-all; line-height: 1.4; font-weight: 500; }
  .sub { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 3px; letter-spacing: .05em; }
  .chev { flex-shrink: 0; width: 16px; height: 16px; color: var(--dim); }
  .chev svg { width: 16px; height: 16px; }

  #empty {
    text-align: center; color: var(--dim); padding: 72px 24px; font-size: 14px;
    letter-spacing: .06em; line-height: 2;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(6px);
    background: rgba(23, 25, 34, .92); color: var(--text);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(217, 171, 92, .22);
    padding: 11px 20px; border-radius: 100px; font-size: 13px; letter-spacing: .03em;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    max-width: 86vw; text-align: center; z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 播放器 ---------- */
  #player-view { display: none; position: fixed; inset: 0; background: #000; z-index: 50; flex-direction: column; }
  #player-view.open { display: flex; }
  #ptitle {
    color: #d8d3c8; font-size: 13px; letter-spacing: .04em;
    padding: 12px 14px calc(12px);
    background: rgba(8, 8, 10, .88);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(235, 225, 205, .06);
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  #ptitle .btn { min-height: 34px; padding: 6px 12px; }
  #ptitle span {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--serif); font-weight: 600; font-size: 14px; letter-spacing: .06em;
  }
  #vwrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  #vwrap::before {
    /* 放映厅暗角 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 58%, rgba(0,0,0,.5) 100%);
  }
  video { width: 100%; max-height: 100%; }
  #pbar {
    background: rgba(8, 8, 10, .88);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid rgba(235, 225, 205, .06);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center;
  }
  #pbar .btn { min-height: 42px; }

  /* ---------- 口令锁 ---------- */
  #keymask {
    display: none; position: fixed; inset: 0; z-index: 200;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px;
    background: radial-gradient(90% 70% at 50% 30%, #14131a 0%, #0a0a0d 70%);
  }
  #keymask.open { display: flex; }
  .mask-card { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .mask-mark { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
    background: var(--gold-soft); border: 1px solid rgba(217, 171, 92, .3); color: var(--gold); }
  .mask-mark svg { width: 24px; height: 24px; }
  .mask-title { font-family: var(--serif); font-weight: 600; font-size: 17px; letter-spacing: .18em; }
  #keymask input {
    width: 100%; padding: 13px; font-size: 16px; border-radius: 12px;
    border: 1px solid rgba(235, 225, 205, .12); background: var(--panel);
    color: var(--text); text-align: center; letter-spacing: .2em; outline: none;
    transition: border-color .2s;
  }
  #keymask input:focus { border-color: rgba(217, 171, 92, .5); }

  /* ---------- 共享文件夹面板 ---------- */
  #roots-view {
    display: none; position: fixed; inset: 0; z-index: 150; align-items: flex-end;
    background: rgba(4, 4, 6, .68);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #roots-view.open { display: flex; }
  .panel {
    background: var(--panel); width: 100%; max-height: 82vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 12px 18px calc(30px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(235, 225, 205, .09);
  }
  .grabber { width: 36px; height: 4px; border-radius: 100px; background: rgba(236,231,220,.18); margin: 2px auto 14px; }
  .panel-title {
    font-family: var(--serif); font-size: 16px; font-weight: 600; letter-spacing: .1em;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
  }
  .panel-title .close {
    cursor: pointer; color: var(--muted); padding: 4px 8px; font-size: 17px;
    width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%;
    background: rgba(236,231,220,.05);
  }
  .tip-line { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.8; }
  #roots-list { list-style: none; margin-bottom: 16px; }
  #roots-list li { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); }
  #roots-list li > span:first-child { color: var(--gold); display: grid; place-items: center; width: 22px; }
  #roots-list li > span:first-child svg { width: 18px; height: 18px; }
  #roots-list .rname { flex: 1; min-width: 0; font-size: 14px; }
  #roots-list .rpath { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; margin-top: 3px; letter-spacing: .02em; }
  .del { color: var(--danger); cursor: pointer; padding: 6px 10px; font-size: 15px; flex-shrink: 0; border-radius: 8px; }
  .del:active { background: rgba(224, 122, 114, .12); }
  .addrow { display: flex; gap: 8px; }
  .addrow input {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 14px; border-radius: 12px;
    border: 1px solid rgba(235, 225, 205, .1); background: var(--bg);
    color: var(--text); outline: none; transition: border-color .2s;
  }
  .addrow input:focus { border-color: rgba(217, 171, 92, .5); }
  .addrow .btn { white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="keymask">
  <div class="mask-card">
    <div class="mask-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="mask-title">请输入访问口令</div>
    <input id="keyinput" type="password" placeholder="口令">
    <button class="btn" onclick="saveKey()">确 定</button>
  </div>
</div>

<div id="roots-view">
  <div class="panel">
    <div class="grabber"></div>
    <div class="panel-title">共享文件夹<span class="close" onclick="closeRoots()">✕</span></div>
    <div class="tip-line">添加电脑上的文件夹（输入电脑里的路径），手机就能浏览并播放里面的所有电影。改动会自动保存，下次启动仍生效。</div>
    <ul id="roots-list"></ul>
    <div class="addrow">
      <input id="newroot" placeholder="如 D:\电影 或 E:\影片">
      <button class="btn" onclick="addRoot()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        添加
      </button>
    </div>
  </div>
</div>

<div id="list-view">
  <header>
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 4v16M16.5 4v16M3 9.5h4.5M3 14.5h4.5M16.5 9.5H21M16.5 14.5H21"/></svg>
      </span>
      <h1>流光逸影</h1>
    </div>
    <div class="hdr-actions">
      <button class="btn" onclick="openRoots()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
        目录
      </button>
      <button class="btn" onclick="location.reload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        刷新
      </button>
    </div>
  </header>
  <div id="crumbs"></div>
  <ul id="list"></ul>
  <div id="empty" style="display:none">这里空空如也<br>点右上角「目录」添加电影文件夹</div>
</div>

<div id="player-view">
  <div id="ptitle">
    <button class="btn" onclick="closePlayer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
      返回
    </button>
    <span id="pname"></span>
  </div>
  <div id="vwrap"><video id="video" controls playsinline></video></div>
  <div id="pbar">
    <button class="btn" id="vlcbtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      复制链接到 VLC
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const video = $('#video');
let curPath = '';
let authKey = localStorage.getItem('ml_key') || new URLSearchParams(location.search).get('key') || '';
if (authKey) localStorage.setItem('ml_key', authKey);

const svgFolder = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
const svgFilm = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 4v16M16.5 4v16M3 9.5h4.5M3 14.5h4.5M16.5 9.5H21M16.5 14.5H21"/></svg>';
const svgDoc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h8l4 4v14h-12z"/><path d="M14.5 3v4h4"/></svg>';
const svgChev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 5.5 6-5.5 6"/></svg>';

function q(params) {
  const p = new URLSearchParams(params);
  if (authKey) p.set('key', authKey);
  return p.toString();
}
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}
function fmtSize(n) {
  if (!n) return '';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 ? 0 : 1) + ' ' + u[i];
}
function saveKey() {
  authKey = $('#keyinput').value.trim();
  localStorage.setItem('ml_key', authKey);
  $('#keymask').classList.remove('open');
  loadDir('');
}
async function api(url, opts) {
  const resp = await fetch(url, opts);
  if (resp.status === 401) { $('#keymask').classList.add('open'); throw new Error('unauthorized'); }
  if (!resp.ok) { let m = '请求失败 ' + resp.status; try { m = (await resp.json()).error || m; } catch(e){} throw new Error(m); }
  return resp.json();
}
function postJSON(url, obj) {
  return api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
}

// ---------- 共享文件夹管理 ----------
function openRoots() { $('#roots-view').classList.add('open'); renderRoots(); }
function closeRoots() { $('#roots-view').classList.remove('open'); }

async function renderRoots() {
  try {
    const data = await api('/api/roots?' + q({}));
    const ul = $('#roots-list'); ul.innerHTML = '';
    for (const r of data.roots) {
      const li = document.createElement('li');
      li.innerHTML = `<span>${svgFolder}</span><div class="rname"><div class="rt"></div><div class="rpath"></div></div><span class="del">✕</span>`;
      li.querySelector('.rt').textContent = r.name;
      li.querySelector('.rpath').textContent = r.dir;
      li.querySelector('.del').onclick = () => removeRoot(r.name);
      ul.appendChild(li);
    }
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message); }
}
async function addRoot() {
  const p = $('#newroot').value.trim();
  if (!p) { toast('请输入电脑上的文件夹路径'); return; }
  try {
    await postJSON('/api/roots/add?' + q({}), { path: p });
    $('#newroot').value = '';
    toast('已添加');
    renderRoots();
    loadDir('');
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message, 3600); }
}
async function removeRoot(name) {
  try {
    await postJSON('/api/roots/remove?' + q({}), { name });
    toast('已移除');
    renderRoots();
    loadDir('');
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message, 3600); }
}

// ---------- 目录浏览 ----------
async function loadDir(path) {
  curPath = path;
  try {
    const data = await api('/api/list?' + q({path}));
    renderCrumbs(path);
    const list = $('#list'); list.innerHTML = '';
    $('#empty').style.display = data.entries.length ? 'none' : 'block';
    for (const e of data.entries) {
      const li = document.createElement('li');
      li.className = e.isDir ? 'item is-dir' : 'item';
      const icon = e.isDir ? svgFolder : (e.isVideo ? svgFilm : svgDoc);
      const sub = e.isDir ? '文件夹' : fmtSize(e.size);
      li.innerHTML = `<div class="icon">${icon}</div><div class="meta"><div class="name"></div><div class="sub">${sub}</div></div><div class="chev">${svgChev}</div>`;
      li.querySelector('.name').textContent = e.name;
      li.onclick = () => e.isDir ? loadDir(path ? path + '/' + e.name : e.name) : playFile(path ? path + '/' + e.name : e.name);
      list.appendChild(li);
    }
  } catch (err) { if (err.message !== 'unauthorized') toast(err.message); }
}
function renderCrumbs(path) {
  const c = $('#crumbs'); c.innerHTML = '';
  const home = document.createElement('a'); home.textContent = '首 页';
  home.onclick = () => loadDir(''); c.appendChild(home);
  if (!path) return;
  let acc = '';
  for (const seg of path.split('/')) {
    acc = acc ? acc + '/' + seg : seg;
    c.appendChild(document.createTextNode(' · '));
    const a = document.createElement('a'); a.textContent = seg;
    const target = acc;
    a.onclick = () => loadDir(target);
    c.appendChild(a);
  }
}

// ---------- 播放（MSE 状态机） ----------
// 缓冲策略：前方最多预读 AHEAD_SEC 秒（防浏览器配额撑爆），后方保留 BEHIND_SEC 秒
const AHEAD_SEC = 30, BEHIND_SEC = 20;
const P = { mode:'', ms:null, sb:null, aborter:null, queue:[], appending:false,
            rebuilding:false, firstAppend:false, path:'', codecs:'', duration:0,
            objUrl:null, stallTimer:null, start:0, lastRebuild:0, rebuildTimes:[] };

function destroyMSE() {
  if (P.aborter) { try { P.aborter.abort(); } catch(e){} P.aborter = null; }
  clearTimeout(P.stallTimer);
  P.queue = []; P.appending = false; P.sb = null;
  if (P.ms) { try { if (P.ms.readyState === 'open') P.ms.endOfStream(); } catch(e){} P.ms = null; }
  if (P.objUrl) { try { URL.revokeObjectURL(P.objUrl); } catch(e){} P.objUrl = null; }
  video.removeAttribute('src'); video.load();
}

async function playFile(path) {
  P.path = path;
  $('#pname').textContent = path.split('/').pop();
  $('#player-view').classList.add('open');
  const streamURL = '/stream?' + q({path});

  // 默认按扩展名判断；有 ffprobe 时用更准确的信息
  let direct = /\.(mp4|m4v|webm)$/i.test(path);
  try {
    const info = await api('/api/probe?' + q({path}));
    direct = info.directPlay;
    P.codecs = info.mseCodecs;
    P.duration = info.duration;
  } catch (e) { P.codecs = 'video/mp4; codecs="avc1.640028, mp4a.40.2"'; P.duration = 0; }

  if (direct) {
    P.mode = 'direct';
    destroyMSE();
    video.src = streamURL;
    video.play().catch(()=>{});
  } else if ('MediaSource' in window) {
    P.mode = 'mse';
    playMSE(0);
  } else {
    toast('此浏览器不支持 MSE，请复制链接到 VLC 播放');
  }
}

function playMSE(start) {
  // 防连续重建死循环：15 秒内重建超过 4 次就停下，建议改用 VLC
  const now = Date.now();
  P.rebuildTimes = P.rebuildTimes.filter(t => now - t < 15000);
  if (P.rebuildTimes.length >= 4) {
    toast('该文件在浏览器中播放不稳定，建议复制链接到 VLC 观看', 4000);
    return;
  }
  P.rebuildTimes.push(now);
  destroyMSE();
  P.rebuilding = true; P.firstAppend = false;
  P.start = start; P.lastRebuild = now;
  P.ms = new MediaSource();
  P.objUrl = URL.createObjectURL(P.ms);
  video.src = P.objUrl;
  P.ms.addEventListener('sourceopen', () => {
    try {
      const mime = P.codecs.startsWith('video/') ? P.codecs : 'video/mp4; codecs="' + P.codecs + '"';
      P.sb = P.ms.addSourceBuffer(mime);
      P.sb.mode = 'segments';
      if (P.duration) P.ms.duration = P.duration;
      P.sb.addEventListener('updateend', onAppendDone);
      if (start > 0) video.currentTime = start;
      fetchStream(start);
    } catch (e) { toast('浏览器不支持该编码: ' + e.message); }
  }, { once: true });
}

// 当前播放点前方已缓存的秒数
function bufferedAhead() {
  const b = video.buffered, t = video.currentTime;
  for (let i = 0; i < b.length; i++)
    if (t >= b.start(i) - 1 && t <= b.end(i)) return b.end(i) - t;
  return 0;
}

async function fetchStream(start) {
  P.aborter = new AbortController();
  try {
    const resp = await fetch('/transcode?' + q({path: P.path, start}), { signal: P.aborter.signal });
    if (!resp.ok) { toast('转码失败 ' + resp.status + '，可复制链接到 VLC 播放'); P.rebuilding = false; return; }
    if (P.sb) P.sb.timestampOffset = start;
    const reader = resp.body.getReader();
    for (;;) {
      // 前方缓冲够 AHEAD_SEC 秒就暂停拉流（边看边拉），消耗后自动继续
      while (bufferedAhead() > AHEAD_SEC) {
        if (P.aborter.signal.aborted) return;
        await new Promise(r => setTimeout(r, 1000));
      }
      const { done, value } = await reader.read();
      if (done) break;
      P.queue.push(value);
      pump();
    }
    if (P.ms && P.ms.readyState === 'open' && !P.queue.length && !P.appending) P.ms.endOfStream();
  } catch (e) { if (e.name !== 'AbortError') console.error(e); }
}

function pump() {
  if (P.appending || !P.sb || P.sb.updating || !P.queue.length) return;
  P.appending = true;
  const chunk = P.queue[0];          // 先看不取，成功后再移除，杜绝丢块
  try {
    P.sb.appendBuffer(chunk);
    P.queue.shift();
  } catch (e) {
    P.appending = false;
    if (e.name === 'QuotaExceededError') { evictBuffer(); setTimeout(pump, 400); }
    else { P.queue.shift(); setTimeout(pump, 120); } // 确认是坏块才丢弃
  }
}
function onAppendDone() {
  P.appending = false;
  if (!P.firstAppend) {
    // 首块可能只是初始化数据（moov），尚未产生可播放缓冲：继续喂，不算重建完成
    if (video.buffered.length === 0) { pump(); return; }
    P.firstAppend = true;
    P.rebuilding = false;
    // 拖动触发的重建：期间若 seek 被吞，补检一次（从头播放不补检，避免误判成死循环）
    if (P.start > 0.5 && !isBuffered(video.currentTime)) {
      const t = video.currentTime;
      setTimeout(() => { if (P.mode === 'mse') playMSE(t); }, 50);
      return;
    }
  }
  evictBehind();
  if (!P.appending) pump();
}
// 主动清理播放点后方 BEHIND_SEC 秒以外的旧缓冲，控制总占用
function evictBehind() {
  if (!P.sb || P.sb.updating || !video.buffered.length) return;
  const t = video.currentTime, s0 = video.buffered.start(0);
  if (t - s0 > BEHIND_SEC + 25) {
    P.appending = true; // remove 是异步的，完成后会再触发 updateend → onAppendDone → pump
    try { P.sb.remove(0, t - BEHIND_SEC); } catch(e) { P.appending = false; }
  }
}
// 配额满时的被动清理（兜底）
function evictBuffer() {
  if (!P.sb || P.sb.updating || !video.buffered.length) return;
  const t = video.currentTime, s0 = video.buffered.start(0);
  if (t - s0 > 10) {
    P.appending = true;
    try { P.sb.remove(0, t - 10); } catch(e) { P.appending = false; }
  }
}

function isBuffered(t) {
  const b = video.buffered;
  for (let i = 0; i < b.length; i++) if (t >= b.start(i) - 0.5 && t <= b.end(i) + 0.5) return true;
  return false;
}
// 严格版：贴到缓冲末尾边缘也算"没数据"（看门狗用，防止数据流断档被宽限掩盖）
function isBufferedStrict(t) {
  const b = video.buffered;
  for (let i = 0; i < b.length; i++) if (t >= b.start(i) - 0.5 && t <= b.end(i) - 0.3) return true;
  return false;
}

// 拖到未缓冲区域 → 中断当前转码流，从新位置重建
video.addEventListener('seeking', () => {
  if (P.mode !== 'mse' || P.rebuilding || !P.sb) return;
  const t = video.currentTime;
  if (!isBuffered(t)) {
    if (P.aborter) P.aborter.abort();
    playMSE(t);
  }
});

// 卡顿看门狗：等待超过 8 秒仍未恢复 → 自动从当前位置重建，保证不卡死
video.addEventListener('waiting', () => {
  if (P.mode !== 'mse' || P.rebuilding) return;
  clearTimeout(P.stallTimer);
  P.stallTimer = setTimeout(() => {
    // 刚重建完不久不插手；用严格判断，贴着缓冲边缘也算断档
    if (P.mode === 'mse' && !P.rebuilding && Date.now() - P.lastRebuild > 12000
        && !isBufferedStrict(video.currentTime)) {
      playMSE(video.currentTime);
    }
  }, 8000);
});
video.addEventListener('playing', () => clearTimeout(P.stallTimer));

video.addEventListener('error', () => {
  if (P.mode === 'direct' && video.getAttribute('src'))
    toast('浏览器无法直接播放该文件，可复制链接到 VLC');
});

$('#vlcbtn').onclick = async () => {
  const url = location.origin + '/stream?' + q({path: P.path});
  try { await navigator.clipboard.writeText(url); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast('链接已复制，打开 VLC → 更多 → 新建串流，粘贴即可');
};

function closePlayer() {
  destroyMSE();
  P.mode = '';
  video.pause();
  $('#player-view').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

loadDir('');
</script>
