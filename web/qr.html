<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0d">
<title>流光逸影 · 扫码观影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --text: #ece7dc;
    --muted: #8f8a7d;
    --dim: #5c5850;
    --gold: #d9ab5c;
    --gold-bright: #edc98a;
    --gold-soft: rgba(217, 171, 92, .12);
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; gap: 0; padding: 40px 24px;
    background: radial-gradient(90% 60% at 50% 18%, #17151d 0%, var(--bg) 62%);
    -webkit-font-smoothing: antialiased;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 999; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
  }
  body::before {
    content: ""; position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 5;
    background: linear-gradient(90deg, transparent 6%, rgba(217,171,92,.7) 30%, #f4e3bb 50%, rgba(217,171,92,.7) 70%, transparent 94%);
    background-size: 220% 100%;
    animation: sheen 8s linear infinite;
    opacity: .6;
  }
  @keyframes sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  ::selection { background: var(--gold-soft); color: var(--gold); }

  .mark { width: 44px; height: 44px; color: var(--gold); margin-bottom: 20px;
    animation: rise .6s cubic-bezier(.22,.7,.25,1) backwards; }
  .mark svg { width: 100%; height: 100%; }
  h1 {
    font-family: var(--serif); font-size: 30px; font-weight: 900; letter-spacing: .3em;
    text-indent: .3em; margin-bottom: 34px; text-align: center;
    animation: rise .6s .08s cubic-bezier(.22,.7,.25,1) backwards;
  }
  .plate-wrap { animation: rise .6s .16s cubic-bezier(.22,.7,.25,1) backwards; }
  .plate {
    background: #f5f1e8; border-radius: 14px; padding: 16px; display: block;
    box-shadow: 0 0 0 1px rgba(217, 171, 92, .45), 0 0 0 9px rgba(217, 171, 92, .07),
                0 24px 70px rgba(0, 0, 0, .55);
  }
  .url {
    font-family: var(--mono); font-size: 15px; color: var(--gold-bright);
    word-break: break-all; text-align: center; margin: 30px auto 8px; max-width: 440px;
    background: var(--gold-soft); border: 1px solid rgba(217,171,92,.18);
    border-radius: 12px; padding: 13px 20px;
    animation: rise .6s .24s cubic-bezier(.22,.7,.25,1) backwards;
  }
  .tip {
    color: var(--muted); font-size: 12.5px; text-align: center; line-height: 2.1;
    letter-spacing: .08em; margin-top: 10px;
    animation: rise .6s .32s cubic-bezier(.22,.7,.25,1) backwards;
  }
  .tip b { color: var(--gold); font-weight: 600; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 4v16M16.5 4v16M3 9.5h4.5M3 14.5h4.5M16.5 9.5H21M16.5 14.5H21"/></svg>
  </div>
  <h1>流光逸影</h1>
  <div class="plate-wrap"><img class="plate" src="/qr.png" width="300" height="300" alt="QR"></div>
  <div class="url">{{URL}}</div>
  <div class="tip">手机与电脑连接同一个 <b>Wi-Fi</b><br>用相机或浏览器扫码即可 · 也可以手动输入上面的网址</div>
</body>
</html>
